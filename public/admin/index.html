<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FiveMarket CMS</title>
    <style>
      .fm-admin-tools {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 9999;
        width: min(340px, calc(100vw - 32px));
        border-radius: 14px;
        border: 1px solid #c7d9c8;
        background: #f8fbf8;
        box-shadow: 0 10px 30px rgba(20, 42, 24, 0.16);
        padding: 12px;
        font-family: "Nunito Sans", Arial, sans-serif;
        color: #1f3f29;
      }
      .fm-admin-tools h3 {
        margin: 0;
        font-size: 14px;
        font-weight: 800;
      }
      .fm-admin-tools p {
        margin: 6px 0 10px;
        font-size: 12px;
        line-height: 1.35;
      }
      .fm-admin-tools__row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .fm-admin-tools button {
        border: 0;
        border-radius: 10px;
        height: 34px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }
      .fm-admin-tools__workflow {
        background: #e3ece3;
        color: #23462d;
      }
      .fm-admin-tools__deploy {
        background: #2f8b42;
        color: #ffffff;
      }
      .fm-admin-tools__publish-now {
        margin-top: 8px;
        width: 100%;
        background: #f0f2f5;
        color: #2d3b44;
      }
      .fm-admin-tools__status {
        min-height: 18px;
        margin-top: 8px;
        font-size: 11px;
        color: #3f6050;
      }
      .fm-status-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 6px;
      }
      .fm-status-chip {
        display: inline-flex;
        align-items: center;
        min-height: 22px;
        border-radius: 999px;
        padding: 2px 9px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }
      .fm-status-chip--published {
        background: #dff3e5;
        color: #1f7c3b;
      }
      .fm-status-chip--ready {
        background: #eadfff;
        color: #6b3cb3;
      }
      .fm-status-chip--draft {
        background: #e2e5ea;
        color: #5a6370;
      }
      .fm-status-chip--hidden {
        background: #f5e6d6;
        color: #8b5a24;
      }
      @media (max-width: 800px) {
        .fm-admin-tools {
          right: 10px;
          bottom: 10px;
          width: min(320px, calc(100vw - 20px));
        }
      }
    </style>
  </head>
  <body>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", (user) => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }

      (function setupAdminTools() {
        const panel = document.createElement("aside");
        panel.className = "fm-admin-tools";
        panel.innerHTML = `
          <h3>Економний режим деплою</h3>
          <p>Статуси: <b>Чорновик</b> / <b>Готові до публікації</b> / <b>Опублікована</b>.</p>
          <div class="fm-admin-tools__row">
            <button type="button" class="fm-admin-tools__workflow">Workflow</button>
            <button type="button" class="fm-admin-tools__deploy">1 деплой</button>
          </div>
          <button type="button" class="fm-admin-tools__publish-now">Опублікувати зараз</button>
          <div class="fm-admin-tools__status" data-status></div>
        `;
        document.body.appendChild(panel);

        const status = panel.querySelector("[data-status]");
        const workflowBtn = panel.querySelector(".fm-admin-tools__workflow");
        const deployBtn = panel.querySelector(".fm-admin-tools__deploy");
        const publishNowBtn = panel.querySelector(".fm-admin-tools__publish-now");

        const setStatus = (text) => {
          if (status) {
            status.textContent = text;
          }
        };

        const normalize = (value) => String(value || "").replace(/\s+/g, " ").trim().toLowerCase();

        function detectWorkflowStateByText(text) {
          const normalized = normalize(text);
          if (!normalized) {
            return "unknown";
          }

          if (
            normalized.includes("опублік") ||
            normalized.includes("published")
          ) {
            return "published";
          }

          if (
            normalized.includes("готово") ||
            normalized === "ready"
          ) {
            return "ready";
          }

          if (
            normalized.includes("in review") ||
            normalized.includes("на розгляді") ||
            normalized.includes("на перевір")
          ) {
            return "in_review";
          }

          if (
            normalized.includes("в роботі") ||
            normalized.includes("чорнов") ||
            normalized === "draft"
          ) {
            return "draft";
          }

          return "unknown";
        }

        function buildStatusChip(label, tone) {
          const chip = document.createElement("span");
          chip.className = `fm-status-chip fm-status-chip--${tone}`;
          chip.textContent = label;
          return chip;
        }

        function addOrUpdateStatusBadges(entry) {
          const entryText = String(entry.textContent || "");
          const hasHiddenFlag = /visible=false/i.test(entryText);

          entry.querySelectorAll("*:not(script):not(style)").forEach((node) => {
            if (node.children.length > 0) {
              return;
            }

            if (!node.textContent || !/visible=(true|false)/i.test(node.textContent)) {
              return;
            }

            node.textContent = node.textContent
              .replace(/\s*·\s*visible=(true|false)\s*/gi, "")
              .replace(/\s{2,}/g, " ")
              .trim();
          });

          const nativeStatus = Array.from(entry.querySelectorAll("span, div, p, small"))
            .find((node) => {
              if (!(node instanceof HTMLElement)) {
                return false;
              }

              const text = normalize(node.textContent || "");
              if (!text || text.length > 36) {
                return false;
              }

              return (
                text.includes("в роботі") ||
                text.includes("чорнов") ||
                text.includes("готово") ||
                text.includes("draft") ||
                text.includes("ready") ||
                text.includes("in review") ||
                text.includes("на розгляді") ||
                text.includes("на перевір") ||
                text.includes("опублік") ||
                text.includes("published")
              );
            }) || null;

          const state = detectWorkflowStateByText(nativeStatus ? nativeStatus.textContent : "");

          if (nativeStatus && nativeStatus instanceof HTMLElement) {
            nativeStatus.style.display = "none";
          }

          let row = entry.querySelector(".fm-status-row");
          if (!row) {
            row = document.createElement("div");
            row.className = "fm-status-row";

            const titleNode = Array.from(entry.querySelectorAll("h1, h2, h3, h4, h5, p, span"))
              .find((node) => node.children.length === 0 && /грн/i.test(node.textContent || ""));

            if (titleNode && titleNode.parentElement) {
              titleNode.insertAdjacentElement("afterend", row);
            } else {
              entry.appendChild(row);
            }
          }

          const stateKey = `${state}-${hasHiddenFlag ? "1" : "0"}`;
          if (row.getAttribute("data-state-key") === stateKey) {
            return;
          }

          row.innerHTML = "";
          row.setAttribute("data-state-key", stateKey);

          if (state === "published" || state === "unknown") {
            row.appendChild(buildStatusChip("Опублікована", "published"));
          }

          if (state === "ready" || state === "in_review") {
            row.appendChild(buildStatusChip("Готові до публікації", "ready"));
          }

          if (state === "draft") {
            row.appendChild(buildStatusChip("Чорновик", "draft"));
          }

          if (hasHiddenFlag) {
            row.appendChild(buildStatusChip("Приховано", "hidden"));
          }
        }

        function enhanceContentStatuses() {
          if (!window.location.hash.includes("#/collections/products")) {
            return;
          }

          const links = Array.from(document.querySelectorAll('a[href*="#/collections/products/entries/"]'));
          links.forEach((entry) => addOrUpdateStatusBadges(entry));
        }

        function relabelWorkflowColumns() {
          if (!window.location.hash.includes("#/workflow")) {
            return;
          }

          const droppables = Array.from(document.querySelectorAll("[data-rbd-droppable-id]"));
          if (!droppables.length) {
            return;
          }

          const detectWorkflowStateByDroppableId = (value) => {
            const normalizedValue = normalize(value);
            if (!normalizedValue) {
              return "unknown";
            }

            if (
              normalizedValue.includes("in_review") ||
              normalizedValue.includes("inreview") ||
              normalizedValue.includes("review")
            ) {
              return "in_review";
            }

            if (normalizedValue.includes("draft")) {
              return "draft";
            }

            if (normalizedValue.includes("ready")) {
              return "ready";
            }

            if (normalizedValue.includes("published")) {
              return "published";
            }

            return "unknown";
          };

          const findColumnRootFromDroppable = (droppable) => {
            let node = droppable.parentElement;
            while (node && node !== document.body) {
              if (typeof node.querySelectorAll !== "function") {
                node = node.parentElement;
                continue;
              }

              const ownDroppables = node.querySelectorAll("[data-rbd-droppable-id]");
              if (ownDroppables.length === 1) {
                const parent = node.parentElement;
                if (!parent) {
                  return node;
                }

                const siblingColumns = Array.from(parent.children).filter(
                  (child) =>
                    child instanceof HTMLElement &&
                    child.querySelector("[data-rbd-droppable-id]")
                );

                if (siblingColumns.length >= 2) {
                  return node;
                }
              }

              node = node.parentElement;
            }

            return droppable.parentElement || droppable;
          };

          const findHeadingForColumn = (columnRoot) => {
            const candidates = Array.from(
              columnRoot.querySelectorAll("h1, h2, h3, h4, [role='heading'], div, span, p, strong")
            );

            return (
              candidates.find((candidate) => {
                if (!(candidate instanceof HTMLElement)) {
                  return false;
                }

                if (candidate.closest("[data-rbd-draggable-id]")) {
                  return false;
                }

                if (candidate.closest('a[href*="#/collections/"][href*="/entries/"]')) {
                  return false;
                }

                if (candidate.tagName === "BUTTON") {
                  return false;
                }

                const text = normalize(candidate.textContent || "");
                if (!text || text.length > 44) {
                  return false;
                }

                return (
                  detectWorkflowStateByText(text) !== "unknown" ||
                  text === "чорновик" ||
                  text === "готові до деплою/публікації" ||
                  text === "опубліковані"
                );
              }) || null
            );
          };

          const workflowLabelByState = {
            draft: "Готові до деплою/публікації",
            in_review: "Чорновик",
            ready: "Опубліковані",
            published: "Опубліковані",
          };

          const workflowOrderByState = {
            in_review: "1",
            draft: "2",
            ready: "3",
            published: "3",
          };

          const relabeledRoots = new Set();
          droppables.forEach((droppable) => {
            const columnRoot = findColumnRootFromDroppable(droppable);
            if (!columnRoot || relabeledRoots.has(columnRoot)) {
              return;
            }
            relabeledRoots.add(columnRoot);

            const stateFromDroppable = detectWorkflowStateByDroppableId(
              droppable.getAttribute("data-rbd-droppable-id") || ""
            );
            const headingNode = findHeadingForColumn(columnRoot);
            const stateFromHeading = headingNode
              ? detectWorkflowStateByText(headingNode.textContent || "")
              : "unknown";

            const state = stateFromDroppable !== "unknown" ? stateFromDroppable : stateFromHeading;
            if (!state || state === "unknown") {
              return;
            }

            if (headingNode) {
              headingNode.textContent = workflowLabelByState[state] || headingNode.textContent;
            }

            const order = workflowOrderByState[state];
            if (order) {
              columnRoot.style.order = order;
            }
          });
        }

        function runAdminEnhancements() {
          enhanceContentStatuses();
          relabelWorkflowColumns();
        }

        let enhanceInProgress = false;
        let enhanceQueued = false;

        function scheduleEnhancements() {
          if (enhanceInProgress) {
            enhanceQueued = true;
            return;
          }

          enhanceInProgress = true;
          window.requestAnimationFrame(() => {
            try {
              runAdminEnhancements();
            } finally {
              enhanceInProgress = false;
              if (enhanceQueued) {
                enhanceQueued = false;
                scheduleEnhancements();
              }
            }
          });
        }

        workflowBtn?.addEventListener("click", () => {
          window.location.hash = "#/workflow";
        });

        publishNowBtn?.addEventListener("click", () => {
          const publishButton = Array.from(document.querySelectorAll("button"))
            .find((button) => {
              if (!(button instanceof HTMLButtonElement)) {
                return false;
              }

              if (button.classList.contains("fm-admin-tools__publish-now")) {
                return false;
              }

              if (button.disabled || button.offsetParent === null) {
                return false;
              }

              const text = normalize(button.textContent || "");
              return text.includes("опублікувати") || text === "publish" || text.includes("publish");
            });

          if (!publishButton) {
            setStatus("Кнопка «Опублікувати» не знайдена. Відкрийте картку товару.");
            return;
          }

          publishButton.click();
          setStatus("Опублікування запущено.");
        });

        deployBtn?.addEventListener("click", async () => {
          setStatus("Перевірка доступу...");
          const user = window.netlifyIdentity && window.netlifyIdentity.currentUser
            ? window.netlifyIdentity.currentUser()
            : null;

          if (!user) {
            setStatus("Увійдіть в Netlify Identity, щоб запустити деплой.");
            return;
          }

          let token = "";
          try {
            token = typeof user.jwt === "function"
              ? await user.jwt(true)
              : (user.token && user.token.access_token) || "";
          } catch (_error) {
            token = (user.token && user.token.access_token) || "";
          }

          if (!token) {
            setStatus("Не вдалося отримати токен доступу.");
            return;
          }

          try {
            setStatus("Запускаю production deploy...");
            const response = await fetch("/.netlify/functions/manual-deploy", {
              method: "POST",
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
              },
            });

            const payload = await response.json().catch(() => ({}));
            if (!response.ok) {
              throw new Error(payload.error || "Помилка запуску деплою.");
            }

            setStatus("Готово: деплой поставлено в чергу.");
          } catch (error) {
            setStatus(error instanceof Error ? error.message : "Не вдалося запустити деплой.");
          }
        });

        const observer = new MutationObserver(() => {
          scheduleEnhancements();
        });

        observer.observe(document.body, {
          childList: true,
          subtree: true,
        });

        window.addEventListener("hashchange", scheduleEnhancements);
        scheduleEnhancements();
      })();
    </script>
  </body>
</html>
